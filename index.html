<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>To-Do List</h1>
    <p class="subjudul">Catat tugas kamu di sini</p>

    <div class="input-grup">
      <input type="text" id="input-tugas" placeholder="Tulis tugas baru...">
      <button id="btn-tambah">Tambah</button>
    </div>

    <p id="pesan-kosong">Belum ada tugas. Tambahkan sekarang!</p>

    <ul id="daftar-tugas"></ul>

    <div class="footer">
      <span id="info-tugas"></span>
      <button id="btn-hapus-selesai">Hapus yang selesai</button>
    </div>
  </div>
</body>
</html>
